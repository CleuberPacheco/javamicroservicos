# ===================================================================
# CONFIGURACAO DA APLICACAO - ESG EFICIENCIA ENERGETICA
# ===================================================================
spring.application.name=esg-eficiencia-energetica
server.port=${SERVER_PORT:8080}

# ===================================================================
# BANCO DE DADOS ORACLE (FIAP)
# Substitua rmXXXXXX e sua senha, ou defina as variaveis de ambiente
# ORACLE_USER e ORACLE_PASSWORD
# ===================================================================
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=rm567059
spring.datasource.password=fiap26
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Limite de conexoes simultaneas para evitar ORA-02391 no Oracle da FIAP
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===================================================================
# FLYWAY MIGRATIONS
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===================================================================
# SEGURANCA JWT (SPRING SECURITY)
# ===================================================================
api.security.token.secret=${JWT_SECRET:esg-eficiencia-energetica-secret-key-2026}

# ===================================================================
# ACTUATOR & SWAGGER / OPENAPI
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
